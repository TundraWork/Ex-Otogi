# Ex-Otogi configuration. Copy to otogi.yaml and adjust.
# ${VAR} in any value is read from the environment; an unset variable is an error.
# Unknown keys are errors, so typos surface at startup. Check with: otogi validate

data_dir: data            # Telegram state lives in <data_dir>/telegram/<account>/
shutdown_timeout: 30s

log:
  level: info             # debug | info | warn | error
  format: json            # json | text

kernel:
  workers: 32             # goroutines running module deliveries
  max_in_flight: 1024     # events admitted but not finished; intake waits beyond this
  handler_timeout: 10m    # per delivery, unless a module sets its own

management:
  addr: 127.0.0.1:8090    # HTTP API for status and the event log; "" disables it
  # token: ${OTOGI_MANAGEMENT_TOKEN}   # required if addr is not loopback

# Platform-qualified actor IDs (as /whoami prints them) allowed to use operator
# commands such as /status. The bot account's own messages always are.
operators: []             # e.g. ["telegram:user:123456789"]

commands:
  prefixes: ["/"]         # "/name args" in a message invokes a module's command

eventlog:
  retention: 168h         # how long event log records are kept

telegram:
  - account: main         # becomes the event account ID; log in with: otogi login main
    app_id: ${OTOGI_TELEGRAM_APP_ID}
    app_hash: ${OTOGI_TELEGRAM_APP_HASH}
    # session: data/telegram/main/session.json
    # database: data/telegram/main/state.sqlite

# Language model providers that modules can use; each is optional.
# llm:
#   gemini:
#     api_key: ${OTOGI_GEMINI_API_KEY}
#     # base_url: https://generativelanguage.googleapis.com   # or a proxy/gateway speaking the Gemini API

modules:
  utility: {}             # /whoami, /ping, /status, /help
  echo: {}                # replies "echo: <text>" to every text message
  notes:                  # /note <text>, /note, /note clear
    max_notes: 50
  reminders:              # /remind 10m tea  (survives restarts)
    max_delay: 720h
  # todou:                # todou issue tracker notifications; link with /todou link <project>
  #   cli: /usr/local/bin/todou          # todou CLI v0.6+ (github.com/orzFly/todou/releases)
  #   server: https://todou.example.com
  #   token: ${OTOGI_TODOU_TOKEN}        # the agent account's todou_pat_… token; the
  #                                      # account needs reader access to linked projects
  #   link_base: ""                      # web URL for issue links; default: server
  #   min_interval: 5m                   # default cooldown between digests per chat (/todou cooldown overrides); activity meanwhile is aggregated
  #   debounce: 10s                      # hold a burst together this long after its first entry
  #   cli_timeout: 60s                   # per one-shot CLI call (the watcher itself is resident)
  #   events: [comment, opened, closed, reopened, status_changed, assigned, spec_pushed, spec_review, question_answered]
  #   max_body_chars: 800                # per collapsed quote; ~4 entries per 4096-unit message
  #   max_attempts: 60                   # tries, a minute apart, before a digest message is given up

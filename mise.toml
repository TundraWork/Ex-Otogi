[tools]
go = "1.26.0"
golangci-lint = "2.11.3"
node = "25.9.0"
pnpm = "10.33.0"
pre-commit = "4.5.1"

[tasks.gen-openapi]
description = "Generate management API OpenAPI spec to docs/management.yaml"
run = "go run ./cmd/bot openapi > docs/management.yaml"
sources = ["internal/driver/managementhttp/**/*.go", "pkg/otogi/management/**/*.go"]
outputs = ["docs/management.yaml"]
